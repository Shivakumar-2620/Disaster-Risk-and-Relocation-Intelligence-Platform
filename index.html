<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wayanad Relocation Decision Portal | KSDMA & DDMA</title>
  
  <!-- Preconnect and Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700;800&family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <!-- Tailwind Play CDN & Stitch Design Tokens -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#1b6850",
            "primary-container": "#398167",
            "on-primary": "#ffffff",
            "on-primary-container": "#f5fff8",
            "secondary": "#4a6459",
            "secondary-container": "#c9e6d8",
            "on-secondary": "#ffffff",
            "on-secondary-container": "#4e685d",
            "tertiary": "#8c4845",
            "tertiary-container": "#a9605c",
            "on-tertiary": "#ffffff",
            "on-tertiary-container": "#fffbff",
            "background": "#f7faf6",
            "on-background": "#181c1a",
            "surface": "#f7faf6",
            "on-surface": "#181c1a",
            "surface-dim": "#d7dbd7",
            "surface-bright": "#f7faf6",
            "surface-variant": "#e0e3e0",
            "on-surface-variant": "#3f4944",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f1f4f0",
            "surface-container": "#ebefeb",
            "surface-container-high": "#e6e9e5",
            "surface-container-highest": "#e0e3e0",
            "outline": "#6f7974",
            "outline-variant": "#bfc9c2",
            "error": "#ba1a1a",
            "error-container": "#ffdad6",
            "on-error": "#ffffff",
            "on-error-container": "#93000a"
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "1rem",
            "xl": "1.5rem",
            "2xl": "2rem",
            "3xl": "2.5rem",
            "full": "9999px"
          },
          spacing: {
            "sidebar-width": "280px",
            "margin-desktop": "24px",
            "margin-mobile": "16px"
          },
          fontFamily: {
            "sans": ["Inter", "sans-serif"],
            "serif": ["Noto Serif", "Georgia", "serif"],
            "mono": ["JetBrains Mono", "monospace"],
            "display-lg": ["Noto Serif", "serif"],
            "display-md": ["Noto Serif", "serif"],
            "headline-sm": ["Noto Serif", "serif"],
            "body-lg": ["Inter", "sans-serif"],
            "body-sm": ["Inter", "sans-serif"],
            "label-md": ["Montserrat", "sans-serif"],
            "data-tabular": ["Montserrat", "JetBrains Mono", "sans-serif"]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-background text-on-surface min-h-screen font-sans antialiased selection:bg-secondary-container selection:text-on-secondary-container">
  <!-- Full Screen Viewport (Landing & Login) -->
  <div id="full-screen-container" class="min-h-screen"></div>

  <!-- Command Center App Shell (Dashboard, Map, Profile, MCDA, Revalidation, Report) -->
  <div id="app-shell" class="hidden min-h-screen flex flex-row">
    <!-- Sidebar Mount -->
    <div id="sidebar-mount"></div>

    <!-- Main Viewport Area -->
    <div class="flex-1 md:ml-[280px] flex flex-col min-h-screen bg-background">
      <!-- Header Mount -->
      <div id="header-mount"></div>

      <!-- Main Screen Content Mount -->
      <main id="main-content-container" class="flex-1"></main>
    </div>
  </div>

  <!-- Global Toast Notifications Mount -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

  <!-- Application Script -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
